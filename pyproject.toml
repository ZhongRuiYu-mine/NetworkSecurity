[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netsec"
version = "0.1.0"
description = "网络安全大作业：CICIDS2017 多机制入侵检测 + 可插拔检测器契约 + MADDPG 多智能体响应 + ICPS 两层融合"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
# 深度学习（平台内置 Autoencoder / ae_paper / ICPS 的 DPNet 都要）
torch = ["torch>=2.0"]
# ICPS 物理层仿真（pandapower IEEE-14）
icps = ["torch>=2.0", "pyarrow>=14", "pandapower>=3.0", "pandera", "geojson"]
# Gym 风格外壳（没有也能跑，环境会退化成纯 Python 类）
gym = ["gymnasium>=0.29"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
